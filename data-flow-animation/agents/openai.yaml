interface:
  display_name: "数据流动画化"
  short_description: "四卡白底双屏动画，数字可查推导，变量、术语与缩写可查含义及作用"
  default_prompt: "使用 $data-flow-animation 分析这段源码并制作白底双屏动画。每个数据数字支持悬浮、聚焦或点击查看初始来源、操作数和具体计算；每个变量名、专有词、英文缩写和单字母参数也可查中文含义、准确全称、当前作用与源码依据。区分容量与有效数、数组与区间、哨兵与零、读前与写后；完整对象、历史、说明和源码术语均可查询。通信至少四个 rank，双页共享进度，当前读写及代码红色高亮，验收数字推导、术语上下文与浮层交互。"
