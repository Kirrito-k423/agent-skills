<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeepEP-Ascend · 控制与源码</title><link rel="stylesheet" href="style.css"><body><main class="app"><header class="top"><div><h1>DeepEP-Ascend · Dispatch 数据流</h1><small>main @ 3b25377d04b2 · 源码语义教学；不是 NPU trace</small></div><div class="toolbar"><button id="openVisual">打开动画屏</button><a id="visualLink" target="_blank">手动打开</a><button id="fullscreen">全屏</button><span class="connection" id="connection"></span></div></header><section><div class="toolbar"><button id="play">播放</button><button id="previous">前一步</button><button id="next">后一步</button><button id="reset">重置</button><label>速度 <select id="speed"><option value="2400">慢 · 2.4 秒/步</option><option value="1400" selected>常规 · 1.4 秒/步</option><option value="600">快 · 0.6 秒/步</option></select></label><label>预设 <select id="preset"></select></label><label>阶段 <select id="stageJump"></select></label></div><div class="progress"><input type="range" id="seek" min="0" max="1" value="0" aria-label="教学进度"><strong id="stepLabel"></strong></div></section><section class="controlMain"><div class="column"><article class="panel stageIntro"><h2 id="stageTitle"></h2><p id="explanation"></p><div class="tags" id="actors"></div><p class="notice" id="condition"></p></article><article class="panel codePanel"><h3>本步真实源码：红色为实际执行行</h3><select id="sourceTab" aria-label="源码片段"></select><div class="codeMeta" id="sourceMeta"></div><div class="code" id="code"></div><a id="fullSource" target="_blank">含函数签名的完整原文 / 行号</a></article></div><div class="column"><article class="panel"><h3>具体 token：点击动画中的记录可反向选择</h3><div class="traceTop"><label>源 rank<select id="rank"></select></label><label>token 编号<select id="token"></select></label><label>hidden 元素<input id="element" type="number" min="0" max="255" value="0"></label></div><p class="notice" id="tokenSummary"></p><div id="trace"></div></article><article class="panel ledger"><h3>任意对象 / 数组元素的读写账本</h3><select id="cell" aria-label="对象账本"></select><div class="ledgerInfo" id="ledgerInfo"></div><div class="currentValue" id="currentValue"></div><div class="history" id="history"></div><button id="inspect">展开完整对象、所有元素与完整历史</button></article></div></section><footer class="footer"><span>红＝本步读 / 写 / 执行；金边＝选中。每步选择合法原子线性化；真实 rank / 核可错开。</span><span class="sessionHint">同设备、同源、同浏览器配置文件联动；关闭全部窗口后重置。</span></footer></main><dialog id="inspector"><h2>对象完整内容与值历史</h2><div class="dialogContent" id="dialogContent"></div><button id="closeDialog">关闭</button></dialog><script type="module" src="app.mjs"></script></body></html>
