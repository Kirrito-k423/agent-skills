    <style>

  --blue: #075da8;

* { box-sizing: border-box; }

html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }

button, input { font: inherit; }

button { color: inherit; }

.boot {

.title-block { min-width: 0; }

.icon-button, .drawer-toggle, .layout-reset {

.track-title { display: flex; align-items: center; margin: 0 0 4px; font-size: 14px; }

}

.graph-node-popover-head button:hover { border-color: #9bb1ec; color: var(--accent); }

.function-body { display: grid; grid-template-rows: minmax(150px, var(--function-top-height, 38%)) 8px minmax(180px, 1fr); padding: 0; overflow: hidden; background: #fbfcfe; }

.function-row-resizer { cursor: row-resize; }
.function-row-resizer::before { content: ""; position: absolute; left: 0; right: 0; top: 3px; height: 2px; border-radius: 2px; background: #c5ccd8; transition: background .12s, box-shadow .12s; }
.function-row-resizer:hover::before, .function-row-resizer:focus-visible::before, .function-row-resizer.active::before { background: var(--accent); box-shadow: 0 0 0 3px rgba(36,87,214,.12); }
.pane-head { min-height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: #f8fafc; }

.middle-view-tabs { display: inline-flex; padding: 2px; border: 1px solid var(--line); border-radius: 7px; background: white; }

.memory-view { min-height: 0; display: grid; grid-template-rows: auto auto auto auto auto auto minmax(150px, 1fr) auto; overflow: hidden; }

x, lane_idx, routing_group_mask) ? dst_rank_idx : -1;","                if (dst_rank_idx >= 0) {","                    // The results are also the SGE indices","                    const auto dst_sgep_idx = asc_atomic_add(ub_layout->rank_histogram + dst_rank_idx, 1);","                    if (dst_rank_idx != rank_idx) {","                        ub_layout->sgep_idx[entry_idx] = dst_sgep_idx;","                    } else {","                        ub_layout->local_copy_dst_slot_idx[i] = dst_sgep_idx;","                    }","                }","                if (group_lane_idx < kNumTopk)","                    ub_layout->dst_rank_idx[entry_idx] = dst_rank_idx;","            }","        }","        asc_syncthreads();","","        // Create logical SQE range","        if (thread_idx < kNumRanks) {","            // TODO: add `vec_core_idx` into shuffling","            const auto peer_rank_idx = (rank_idx + thread_idx) % kNumRanks;","            if (peer_rank_idx != rank_idx) {","                ub_layout->lsqe_base_idx[peer_rank_idx] = asc_atomic_add(","                    &ub_layout->lsqe_counter,","                    math::ceil_div(ub_layout->rank_histogram[peer_rank_idx], kNumSGEPairsPerSQE));","            }","        }","","        // Reduce all vector cores' expert histogram results.","        if (thread_idx < kNumExperts) {","            asc_atomic_add(","                workspace_layout.get_local_expert_histogram_ptr(thread_idx),","                reduction::kReductionIdentity | ub_layout->expert_histogram[thread_idx]);","        }","","        EP_STATIC_ASSERT(kNumVecCores <= 2 * warpSize and kNumVecCores <= kNumMaxVecCores);","        if (thread_idx < kNumRanks) {","            // local-rank-histogram[kNumVecCores, kNumRanks]","            auto ptr = workspace_layout.get_local_rank_histogram_ptr(vec_core_idx, thread_idx);","            *ptr = reduction::kReductionIdentity | ub_layout->rank_histogram[thread_idx];","            asc_threadfence();","        }","        asc_syncthreads();","        // calculate prefix sum of rank counts","        // local-rank-histogram-new[i, j] = \\sum_{k=0}^{i-1} local-rank-histogram[k, j]","        for (int peer_idx = vec_core_idx + warp_idx * kNumVecCores; peer_idx < kNumRanks; peer_idx += kNumVecCores * kNumWarps) {","            const auto lower_ptr = workspace_layout.get_local_rank_histogram_ptr(lane_idx, peer_idx);","            const auto upper_ptr = workspace_layout.get_local_rank_histogram_ptr(lane_idx + warpSize, peer_idx);","            int lower = 0, upper = 0;","            if (lane_idx < kNumVecCores)","                lower = reduction::get_reduction_value(reduction::simt::wait_ready(lower_ptr, 1));","            const auto lower_sum = simt::warp_inclusive_sum(lower, lane_idx);","            const auto lower_total = simt::exchange(lower_sum, warpSize - 1);","            if (lane_idx + warpSize < kNumVecCores)","                upper = reduction::get_reduction_value(reduction::simt::wait_ready(upper_ptr, 1));","            const auto upper_sum = simt::warp_inclusive_sum(upper, lane_idx);","            const auto upper_total = simt::exchange(upper_sum, warpSize - 1);","            // Finish reading both halves before replacing counts with prefixes.","            asc_threadfence();","            if (lane_idx == 0)","                ub_layout->rank_psum[peer_idx] = lower_total + upper_total;","            if (lane_idx < kNumVecCores)","                *lower_ptr = 2 * reduction::kReductionIdentity | (lower_sum - lower);","            if (lane_idx + warpSize < kNumVecCores)","                *upper_ptr = 2 * reduction::kReductionIdentity | (lower_total + upper_sum - upper);","        }","        // obtain the final psum of rank counts","        // rank-hist[rank_idx] = local-rank-histogram-new[vec_core_idx, rank_idx]","        if (thread_idx < kNumRanks) {","            const auto ptr = workspace_layout.get_local_rank_histogram_ptr(vec_core_idx, thread_idx);","            ub_layout->rank_histogram[thread_idx] = reduction::get_reduction_value(reduction::simt::wait_ready(ptr, 2));","            *ptr = 0;","        }","        asc_syncthreads();","","        // Assign slots and create local copies' metadata","        // Also, create the global SGE to entry mapping","        // NOTES: this costs 1 us","        for (int i = group_idx; i < num_iterations; i += num_groups_per_wave) {","            const auto token_idx = vec_core_idx * kNumMaxTokensPerVecCore + i;","            const auto entry_idx = i * kNumTopk + group_lane_idx;","            int dst_rank_idx = -1, dst_slot_idx = -1, global_sgep_idx = -1;","            if (i < kNumMaxTokensPerVecCore and token_idx < num_tokens and group_lane_idx < kNumTopk) {","                // Read rank index","                dst_rank_idx = ub_layout->dst_rank_idx[entry_idx];","","                // Assign slots","                if (dst_rank_idx >= 0) {","                    if (dst_rank_idx != rank_idx) {","                        const auto sgep_idx = ub_layout->sgep_idx[entry_idx];","                        dst_slot_idx = ub_layout->rank_histogram[dst_rank_idx] + sgep_idx;","                        const auto lsqe_base_idx = ub_layout->lsqe_base_idx[dst_rank_idx];","                        global_sgep_idx = lsqe_base_idx * kNumSGEPairsPerSQE + sgep_idx;","                        ub_layout->sgep_to_entry[global_sgep_idx] = entry_idx;","                    } else {","                        dst_slot_idx = ub_layout->rank_histogram[dst_rank_idx] + ub_layout->local_copy_dst_slot_idx[i];","                    }","                }","                ub_layout->dst_slot_idx[entry_idx] = dst_slot_idx;","                dst_buffer_slot_idx[token_idx * kNumTopk + group_lane_idx] = dst_slot_idx;","                dst_gsge_idx[token_idx * kNumTopk + group_lane_idx] = global_sgep_idx;","            }","","            // For local copies","            if (i < kNumMaxTokensPerVecCore and token_idx < num_tokens) {" ","","    // Write SQEs","    static constexpr int kNumWQEBBLanes = handle::kNumWQEBBBytes / sizeof(uint64_t);","    static constexpr int kNumWriteHeaderLanes = sizeof(AscendC::HcommUrmaSqeCtx) / sizeof(uint64_t);","    static constexpr int kNumSGEPairLanes = 2 * sizeof(AscendC::HcommUrmaSgeCtx) / sizeof(uint64_t);","    const int num_sqes = ub_layout->lsqe_counter;","","    const int num_sqes_per_warp = math::ceil_div(num_sqes, kNumWarps);","    const int start_lsqe_idx = warp_idx * num_sqes_per_warp;","    const int end_lsqe_idx = math::min(start_lsqe_idx + num_sqes_per_warp, num_sqes);","    for (int i = start_lsqe_idx; i < end_lsqe_idx; ++ i) {","        // Allocate physical SQE","        int psqe_idx = 0;","        if (lane_idx == 0)","            psqe_idx = asc_atomic_add(&ub_layout->psqe_counter, 1);","        psqe_idx = simt::exchange(psqe_idx, 0);","","        // Now we need to know the SGEs' source and destination (rank and slot)","        // Also, we use `entry_idx` to see whether the SGE is valid","        EP_STATIC_ASSERT(kNumSGEPairsPerSQE <= warpSize);","        int entry_idx = -1, dst_rank_idx = -1, dst_slot_idx = -1;","        if (lane_idx < kNumSGEPairsPerSQE) {","            const auto global_sge_idx = psqe_idx * kNumSGEPairsPerSQE + lane_idx;","            entry_idx = ub_layout->sgep_to_entry[global_sge_idx];","            if (entry_idx >= 0) {","                dst_rank_idx = ub_layout->dst_rank_idx[entry_idx];","                dst_slot_idx = ub_layout->dst_slot_idx[entry_idx];","            }","        }","","        // Create SQE","        // 48B header + 16B * 12 SGEs <= 4 x 64B WQEBBs","        // Header uses 6 lanes","        // SGE pair uses 4 lanes","        // For example","        // Lane 6/7: SGE 0, SGEP 0 token data (the token index is from lane 0)","        //   - ptr = math::advance_ptr(x, token_idx * kHiddenBytes)","        // Lane 8/9: SGE 1, SGEP 0 token meta (the token index is from lane 0)","        //   - ptr = math::advance_ptr(metadata_send_buffer, token_idx * token_layout.get_num_bytes(true))","        // Lane 10/11: SGE 2, SGEP 1 token data (the token index is from lane 1)","        //   - ptr = math::advance_ptr(x, token_idx * kHiddenBytes)","        // Lane 12/13: SGE 3, SGEP 1 token meta (the token index is from lane 1)","        //   - ptr = math::advance_ptr(metadata_send_buffer, token_idx * token_layout.get_num_bytes(true))","        // ...","        EP_STATIC_ASSERT(kNumSGEPairsPerSQE == 6);","        const auto num_sgeps = __reduce_add(entry_idx >= 0);","        const auto num_sges = num_sgeps * 2;","        const auto num_wqebbs = math::ceil_div(","            static_cast<int>(sizeof(AscendC::HcommUrmaSqeCtx) + num_sges * sizeof(AscendC::HcommUrmaSgeCtx)),","            handle::kNumWQEBBBytes);","        const auto sqe_dst_rank_idx = simt::exchange(dst_rank_idx, 0);","        const auto sqe_dst_slot_idx = simt::exchange(dst_slot_idx, 0);","        const auto peer_info = ub_layout->peer_info + sqe_dst_rank_idx;","        const auto peer_info_words = reinterpret_cast<__ubuf__ uint64_t*>(peer_info);","        const auto sgep_idx = lane_idx < kNumWriteHeaderLanes ? 0 :","            math::min((lane_idx - kNumWriteHeaderLanes) / kNumSGEPairLanes, kNumSGEPairsPerSQE - 1);","        const auto sgep_entry_idx = simt::exchange(entry_idx, sgep_idx);","","        const auto slot_head =","            static_cast<uint32_t>(ub_layout->jetty_info.packed_head) +","            psqe_idx * kNumWQEBBsPerSQESlot;","        const auto wqebb_head = slot_head + lane_idx / kNumWQEBBLanes;","        const auto owner_bit = static_cast<uint64_t>((wqebb_head & handle::kSQDepth) == 0) << 31;","        const auto sq_wqebb_idx = wqebb_head % handle::kSQDepth;","","        uint64_t sqe_word = 0;","        if (lane_idx == 0) {","            sqe_word = handle::kWriteSQEHeaderTemplate | owner_bit | static_cast<uint64_t>(sq_wqebb_idx);","            // Request strong order and CQE for the last physical SQE.","            if (psqe_idx + 1 == num_sqes)","                sqe_word |= handle::kWriteSQEFinalFlags;","        } else if (lane_idx < kNumWriteHeaderLanes) {","            sqe_word = peer_info_words[lane_idx - 1];","            if (lane_idx == 1)","                sqe_word |= static_cast<uint64_t>(num_sges) << 24;  // num_sges","            if (lane_idx == 5)","                sqe_word += recv_buffer_offset + static_cast<uint64_t>(sqe_dst_slot_idx) * num_token_bytes;  // remote_addr","        } else if (lane_idx < kNumWriteHeaderLanes + num_sgeps * kNumSGEPairLanes) {","            const auto sgep_lane_idx = (lane_idx - kNumWriteHeaderLanes) % kNumSGEPairLanes;","            const auto token_idx = vec_core_idx * kNumMaxTokensPerVecCore + sgep_entry_idx / kNumTopk;","            if (sgep_lane_idx == 0) {","                sqe_word = static_cast<uint64_t>(num_hidden_bytes);","            } else if (sgep_lane_idx == 1) {","                sqe_word = reinterpret_cast<uint64_t>(x) + static_cast<uint64_t>(token_idx) * num_hidden_bytes;","            } else if (sgep_lane_idx == 2) {","                sqe_word = static_cast<uint64_t>(num_metadata_bytes);","            } else {","                sqe_word = reinterpret_cast<uint64_t>(metadata_send_buffer) +","                    static_cast<uint64_t>(token_idx) * num_metadata_bytes;","            }","        } else if (lane_idx >= num_wqebbs * kNumWQEBBLanes and lane_idx % kNumWQEBBLanes == 0) {","            sqe_word = handle::kNopSQEHeaderTemplate | owner_bit | static_cast<uint64_t>(sq_wqebb_idx);","        }","","        // TODO: we can assume SQ depth is power of 2","        // TODO: some of the expression can use i32","        asc_stcg(","            reinterpret_cast<__gm__ uint64_t*>(ub_layout->jetty_info.sq_base_addr) +","                static_cast<uint64_t>(sq_wqebb_idx) * kNumWQEBBLanes + lane_idx % kNumWQEBBLanes,","            sqe_word);","","        // TODO(Kexing): `syncthreads` and notify doorbell","        // N istogram_ptr(dst_expert_idx), dst_rank_idx),","            reduction::kReductionIdentity | num_local_tokens","        );","","        // Clean for later usages","        *workspace_layout.get_local_expert_histogram_ptr(thread_idx) = 0;","    }","","    // Expert reduction: wait for all ranks' arrival","    if (vec_core_idx == 0 and thread_idx < kNumExpertsPerRank) {","        const auto status = reduction::simt::wait_ready<kNumTimeoutCycles>(","            workspace_layout.get_remote_expert_histogram_ptr(thread_idx), kNumRanks);","","        // Record the token count into UB, GM and host buffers","        // TODO: the results to host may be not aligned","        const auto num_recv_tokens = reduction::get_reduction_value(status);","        if constexpr (kDoCPUSync) {","            *host_workspace_layout.get_host_expert_count_ptr(thread_idx) =","                reduction::make_reduction_status(kNumRanks, math::align(num_recv_tokens, kExpertAlignment));","        }","        num_unaligned_recv_tokens_per_expert[thread_idx] = num_recv_tokens;","        ub_layout->expert_histogram[thread_idx] = num_recv_tokens;","        if (cumulative_local_expert_recv_stats != nullptr)","            asc_atomic_add(cumulative_local_expert_recv_stats + thread_idx, num_recv_tokens);","","        // Clean for later usages","        *workspace_layout.get_remote_expert_histogram_ptr(thread_idx) = 0;","    }","","    // Rank reduction: wait for all vector cores, send to remote, wait for all ranks and clean reduction workspace","    EP_STATIC_ASSERT(kNumRanks <= kNumThreads);","    EP_STATIC_ASSERT(kNumVecCores > 1);","    if (vec_core_idx == 1 and thread_idx < kNumRanks) {","        // Wait remote arrival","        ub_layout->rank_psum[thread_idx] = reduction::get_reduction_value(","            reduction::simt::wait_ready<kNumTimeoutCycles>(","                workspace_layout.get_remote_rank_histogram_ptr(thread_idx), kNumVecCores));","","        // Clean workspace for next usages","        *workspace_layout.get_remote_rank_histogram_ptr(thread_idx) = 0;","    }","    asc_syncthreads();","","    // Create expert psum layout","    if (vec_core_idx == 0 and thread_idx < warpSize) {","        int inclusive_psum = 0;","        #pragma unroll","        for (int i = 0; i < math::ceil_div(kNumExpertsPerRank, warpSize); ++ i) {","            const auto idx = i * warpSize + thread_idx;","            const auto value = idx < kNumExpertsPerRank ? ub_layout->expert_histogram[idx] : 0;","            const auto aligned = math::align(value, kExpertAlignment);","            const auto inclusive_warp_psum = simt::warp_inclusive_sum(aligned, thread_idx);","            const auto exclusive_warp_psum = inclusive_warp_psum - aligned;","","            // Store into global memory","            // NOTES: elements in psum are aligned, but the current value is not aligned","            if (idx < kNumExpertsPerRank)","                psum_num_recv_tokens_per_expert[idx] = inclusive_psum + exclusive_warp_psum + value;","","            // Maintain in-loop psum","            inclusive_psum += simt::exchange(inclusive_warp_psum, warpSize - 1);","        }","    }","","    // Create rank psum layout","    if (vec_core_idx == 1 and thread_idx < warpSize) {","        int inclusive_psum = 0;","        #pragma unroll","        for (int i = 0; i < math::ceil_div(kNumRanks, warpSize); ++ i) {","            const auto idx = i * warpSize + lane_idx;","            const auto value = idx < kNumRanks ? ub_layout->rank_psum[idx] : 0;","            const auto inclusive_warp_psum = simt::warp_inclusive_sum(value, lane_idx);","            const auto psum = inclusive_psum + inclusive_warp_psum;","","            // Write global memory","            if (idx < kNumRanks) {","                psum_num_recv_tokens_per_rank[idx] = psum;","                if constexpr (kDoCPUSync) {","                    *host_workspace_layout.get_host_rank_count_ptr(idx) =","                        reduction::make_reduction_status(kNumRanks, value);","                }","            }","","            // Maintain in-loop psum","            inclusive_psum += simt::exchange(inclusive_warp_psum, warpSize - 1);","        }","    }","}","","template <int kNumRanks, int kNumExperts, int kNumTopk,","          int kExpertAlignment, bool kCachedMode, bool kDoCPUSync,","          int kNumVecCores,","          int kNumHiddenBytes, int kNumSFPacks, int kNumMaxTokensPerRank, int kNumUbBytes,","          int64_t kNumTimeoutCycles, bool kDoBarrier = false,","          int kNumMaxTokensPerVecCore = math::ceil_div(kNumMaxTokensPerRank, kNumVecCores),","          int kNumJetties = kNumVecCores,","          int kNumSGEPairsPerSQE = 6>","__global__ __vector__ void dispatch_impl(","    __gm__ void* x, __gm__ sf_pack_t* sf,","    __gm__ int64_t* topk_idx, __gm__ float* topk_weights,","    __gm__ uint8_t* metadata_send_buffer,","    __gm__ int* cumulative_local_expert_recv_stats,","    __gm__ int* psum_num_recv_tokens_per_rank,","    __gm__ int* psum_num_recv_tokens_per_expert, __gm__ int* num_unaligned_recv_tokens_per_expert,","    __gm__ int* dst_buffer_slot_idx, __gm__ int* dst_gsge_idx,","    __gm__ void* buffer, __gm__ void* workspace, __gm__ void* host_workspace,","    __gm__ void* jetty_ptrs,","    const int rank_idx,","    const int num_tokens,","    const int sf_token_stride,","    const int sf_hidden_stride) {","    // TODO(HUAWEI): kernel launch & init SoC cost 1.9 us, which is slow","    AscendC::InitSocState();","","    // Checks","    // NOTES: the one-to-many-rank Jetty is private for this vector core","    EP_STATIC_ASSERT(kNumRanks <= kNumMaxRanks);","    EP_STATIC_ASSERT(kNumExperts % kNumRanks == 0);","    EP_STATIC_ASSERT(math::is_power_of_2(kExpertAlignment));","    EP_STATIC_ASSERT(kNumVecCores > 0);","    EP_STATIC_ASSERT(kNumTopk > 0);","    EP_STATIC_ASSERT(kNumMaxTokensPerRank > 0);","    EP_STATIC_ASSERT(kNumMaxTokensPerVecCore > 0);","    EP_STATIC_ASSERT(kNumSGEPairsPerSQE <= handle::kNumMaxSGEPairsPerSQE);","    EP_STATIC_ASSERT(kNumRanks <= reduction::kReductionMaxHighCount and kNumVecCores <= reduction::kReductionMaxHighCount,","                     \"Reduction arrival count exceeds 8 bits\");","    EP_STATIC_ASSERT(static_cast<int64_t>(kNumMaxTokensPerRank) * kNumRanks <= reduction::kReductionMaxLowCount,","                     \"Per-expert token count exceeds the 24-bit reduction value\");","    EP_STATIC_ASSERT(not kDoCPUSync or math::align<int64_t>(","                         static_cast<int64_t>(kNumMaxTokensPerRank) * kNumRanks, kExpertAlignment) <= reduction::kReductionMaxLowCount,","                     \"Aligned expert count exceeds the 24-bit host notification value\");","    EP_STATIC_ASSERT(math::align<int64_t>(","                         static_cast<int64_t>(kNumMaxTokensPerRank) * kNumRanks * math::min(kNumTopk, kNumExperts / kNumRanks) +","                         static_cast<int64_t>(kExpertAlignment - 1) * (kNumExperts / kNumRanks), kExpertAlignment) <= INT_MAX,","                     \"Expanded token count including expert padding overflows int\");","","    // Each remote peer can leave one partially filled SQE; all SQEs are written before the doorbell.","    static constexpr int64_t kNumMaxRemoteEntries =","        static_cast<int64_t>(kNumMaxTokensPerVecCore) * math::min(kNumTopk, kNumRanks - 1);","    static constexpr int64_t kNumMaxSQEs = math::min(kNumMaxRemoteEntries, math::min<int64_t>(","        static_cast<int64_t>(kNumRanks - 1) * math::ceil_div(kNumMaxTokensPerVecCore, kNumSGEPairsPerSQE),","        (kNumMaxRemoteEntries + static_cast<int64_t>(kNumRanks - 1) * (kNumSGEPairsPerSQE - 1)) / kNumSGEPairsPerSQE));","    EP_STATIC_ASSERT(kNumMaxSQEs * kNumWQEBBsPerSQESlot <= static_cast<int64_t>(UINT16_MAX) + 1,","                     \"Dispatch WQEBBs exceed the 16-bit SQ index range\");","    // TODO: tune the best Jetty count","    EP_STATIC_ASSERT(kNumJetties == kNumVecCores and kNumJetties <= 64);","    EP_DEVICE_ASSERT(0 <= num_tokens and num_tokens <= kNumMaxTokensPerRank);","    if constexpr (kNumSFPacks > 0)","        EP_DEVICE_ASSERT(sf_token_stride > 0 and sf_hidden_stride > 0);","","    const auto vec_core_idx = static_cast<int>(AscendC::GetBlockIdx());","    const auto workspace_layout = layout::EPWorkspaceLayout(workspace);","    const auto host_workspace_layout = layout::EPWorkspaceLayout(host_workspace);","","    // Token and buffer layouts","    // Cached dispatch reuses source metadata from the handle; only SF and weights travel again.","    const auto token_layout = layout::TokenLayout(","        kNumHiddenBytes, kNumSFPacks * sizeof(sf_pack_t), kNumTopk, not kCachedMode);","    const auto recv_buffer = layout::BufferLayout(","        token_layout, kNumRanks, kNumMaxTokensPerRank,","        math::advance_ptr<void>(buffer, 0)","    ).get_rank_buffer(rank_idx);","","    // Assign unified buffer","    using ub_layout_t = DispatchUBLayout<kNumExperts, kNumRanks, kNumMaxTokensPerVecCore * kNumTopk, kNumMaxTokensPerVecCore>;","    using ub_layout_with_buffer_t = UBLayoutWithBuffer<ub_layout_t, kNumHiddenBytes, kNumSFPacks,","        kNumTopk, kNumMaxTokensPerVecCore, kNumUbBytes, kCachedMode>;","    EP_STATIC_ASSERT(sizeof(ub_layout_with_buffer_t) <= kNumUbBytes, \"Dispatch buffers exceed UB capacity\");","    constexpr auto kNumMetadataMTEStages = ub_layout_with_buffer_t::kNumMetadataMTEStages;","    constexpr auto kNumHiddenMTEStages = ub_layout_with_buffer_t::kNumHiddenMTEStages;","    constexpr auto kNumTokensPerMetadataMTE = ub_layout_with_buffer_t::kNumTokensPerMetadataMTE;","    const auto ub = reinterpret_cast<__ubuf__ ub_layout_with_buffer_t*>(0);","    const auto ub_layout = &ub->workspace;","    const auto metadata_token_layout = layout::TokenLayout(","        0, kNumSFPacks * sizeof(sf_pack_t), kNumTopk, not kCachedMode);","    const auto ub_metadata_buffer = layout::BufferLayout(","        metadata_token_layout, kNumMetadataMTEStages, kNumTokensPerMetadataMTE,","        math::advance_ptr<void>(ub->metadata, 0)","    );","","    // Barrier before dispatch","    // NOTES: this costs 4 us (8 ranks)","    // NOTES: marking is for aligning different ranks' time","#if defined(ASCENDC_TRACE_ON)","    static constexpr uint16_t kTraceBarrierBefore = 0x101;","    static constexpr uint16_t kTraceBarrierAfter = 0x102;","    if (vec_core_idx == 0)","        asc_mark_stamp<PIPE_S>(kTraceBarrierBefore);","#endif","    comm::scalar::barrier<kNumRanks, kNumTimeoutCycles, false>(workspace_layout.get_common_signals(), vec_core_idx);","#if defined(ASCENDC_TRACE_ON)","    if (vec_core_idx == 0)","        asc_mark_stamp<PIPE_S>(kTraceBarrierAfter);","#endif","","    // Do notify, SQE writes and local copy pipeline using a SIMT persistent worker","    handle::HcommJetty jetty(&ub_layout->jetty_info, nullptr, nullptr, vec_core_idx);","","    {","        static constexpr int kNumThreads = 512;","        ub_layout->local_copy_ready = 0;","        ub_layout->metadata_ready = 0;","","        // Fence S -> V","        asc_sync_notify(PIPE_S, PIPE_V, static_cast<event_t>(0));","        asc_sync_wait(PIPE_S, PIPE_V, static_cast<event_t>(0));","","        // Call VF","        // TODO(HUAWEI): launching this VF costs 0.5 us, which is slow","        AscendC::Simt::VF_CALL<","            simt_persistent_worker<kNumMaxTokensPerRank, kNumRanks, kNumExperts, kNumTopk, kExpertAlignment, kCachedMode, kDoCPUSync,","                                   kNumVecCores, kNumThreads, kNumSGEPairsPerSQE, kNumTimeoutCycles>>(","            AscendC::Simt::Dim3(kNumThreads, 1, 1),","            workspace_layout, host_workspace_layout, ub_layout,","            static_cast<__gm__ const uint8_t*>(x), metadata_send_buffer,","            static_cast<__gm__ const uint64_t*>(jetty_ptrs),","            topk_idx, cumulative_local_expert_recv_stats,","            psum_num_recv_tokens_per_rank, psum_num_recv_tokens_per_expert, num_unaligned_recv_tokens_per_expert,","            dst_buffer_slot_idx, dst_gsge_idx,","            reinterpret_cast<uint64_t>(recv_buffer.base) - reinterpret_cast<uint64_t>(workspace),","            kNumHiddenBytes, static_cast<int>(token_layout.get_num_bytes(true)),","            static_cast<int>(token_layout.get_num_bytes()),","            num_tokens, vec_core_idx, rank_idx","        );","    }","","    auto preload_metadata = [&](const int token_idx, const int stage_idx) __aicore__ {","        const auto ub_metadata = ub_metadata_buffer.get_token_buffer(stage_idx * kNumTokensPerMetadataMTE);","        const auto num_metadata_bytes = static_cast<uint32_t>(metadata_token_layout.get_num_bytes());","        const auto num_tokens_in_stage = math::min(","            kNumTokensPerMetadataMTE,","            math::max(0, math::min(num_tokens, (vec_core_idx + 1) * kNumMaxTokensPerVecCore) - token_idx));","","        // Copy metadata within this AIV's contiguous token range","        asc_sync_wait(PIPE_MTE3, PIPE_MTE2, static_cast<event_t>(stage_idx));","        if constexpr (kNumSFPacks > 0) {","            const auto gm_sf = math::advance_ptr<__gm__ sf_pack_t>(","                sf, static_cast<int64_t>(token_idx) * sf_token_stride * sizeof(sf_pack_t));","            if (sf_hidden_stride == 1) {","                asc_copy_gm2ub_align(","                    ub_metadata.template get_sf_ptr<__ubuf__ sf_pack_t>(), gm_sf,","                    /* n_burst= */ static_cast<uint16_t>(num_tokens_in_stage),","                    /* len_burst= */ kNumSFPacks * sizeof(sf_pack_t),","                    /* left_padding_num= */ 0, /* right_padding_num= */ 0,","                    /* enable_constant_pad= */ false,","                    /* l2_cache_mode= */ static_cast<uint8_t>(LD_L2CacheType::L2_CACHE_HINT_NORMAL_FV),","                    /* src_stride= */ static_cast<uint64_t>(sf_token_stride) * sizeof(sf_pack_t),","                    /* dst_stride= */ num_metadata_bytes","                );","            } else {","   const functions = analysis.functions;

  const moduleMap = new Map(modules.map((item) => [item.id, item]));
  const memorySpaceMap = new Map((memoryModel?.spaces || []).map((item) => [item.id, item]));
  const memoryRegionMap = new Map(memoryRegions.map((item) => [item.id, item]));
  const memoryTransferMap = new Map(memoryTransfers.map((item) => [item.id, item]));
  const memoryPathMap = new Map(memoryPaths.map((item) => [item.id, item]));

    ? analysis.primary_path.filter((moduleId) => moduleMap.has(moduleId) && !moduleMap.get(moduleId).inactive)
    : [];
  const primaryPath = declaredPrimaryPath.length >= 2
    ? declaredPrimaryPath
    : modules.filter((item) => !item.inactive).map((item) => item.id);
  const primaryPathSet = new Set(primaryPath);
  const orderedModules = [
    ...primaryPath.map((moduleId) => moduleMap.get(moduleId)),
    ...modules.filter((item) => !primaryPathSet.has(item.id) && !item.inactive),
    ...modules.filter((item) => !primaryPathSet.has(item.id) && item.inactive),
  ];
  const moduleNumberMap = new Map(orderedModules.map((item, index) => [item.id, index + 1]));
  const lineNoteMap = new Map();
  for (const fn of functions) {
    for (const note of fn.line_notes || []) lineNoteMap.set(note.line, { ...note, functionId: fn.id });

    <aside id="graph-node-popover" class="graph-node-popover" role="tooltip" aria-hidden="true"></aside>
    <div id="drawer-backdrop" class="drawer-backdrop" aria-hidden="true"><aside id="drawer" class="drawer"></aside></div>
  `;

  const e2eBody = document.getElementById("e2e-body");
  const functionBody = document.getElementById("function-body");
  const tracks = app.querySelector(".tracks");
  const codeTable = document.getElementById("code-table");
  const searchInput = document.getElementById("source-search");
  const searchCount = document.getElementById("search-count");
  const searchPrev = document.getElementById("search-prev");
  const searchNext = document.getElementById("search-next");
  const graphNodePopover = document.getElementById("graph-node-popover");
  const drawerBackdrop = document.getElementById("drawer-backdrop");
  const drawer = document.getElementById("drawer");
  let graphInfoAnchor = null;
  let graphInfoFrame = 0;
  let resizeSession = null;
  let layoutFrame = 0;

  const layoutLimits = {
    left: 240,
    middle: 300,
    code: 420,
    functionTop: 150,
    functionBottom: 180,
    splitter: 8,
  };
  const defaultLayout = { leftRatio: .30, middleRatio: .31, memoryRatio: .61, functionTopRatio: .38 };
  const clamp = (value, minimum, maximum) => Math.min(maximum, Math.max(minimum, value));

  function applyWorkspaceMode() {
    const memoryMode = state.workspaceView === "memory" && memoryModel;
    const leftTrack = tracks.querySelector('[data-track="e2e"]');
    const leftSeparator = tracks.querySelector('[data-column-resizer="left-middle"]');
    leftTrack.hidden = Boolean(memoryMode);
    leftSeparator.hidden = Boolean(memoryMode);
    tracks.classList.toggle("memory-workspace-mode", Boolean(memoryMode));
    functionBody.classList.toggle("memory-workspace-body", Boolean(memoryMode));
    document.querySelector("[data-workspace-title]").textContent = memoryMode ? "内存申请、容量与通信流" : "函数逻辑";
    document.querySelector("[data-workspace-index]").textContent = memoryMode ? "1" : "2";
    document.querySelector("[data-code-index]").textContent = memoryMode ? "2" : "3";
    document.getElementById("workspace-track-subtitle").textContent = memoryMode
      ? "大块申请与峰值预算 · 空间切片 · 关键传输路径 · 点击定位源码"
      : "上：函数调用 DAG · 下：当前函数逐段理解";
    document.querySelectorAll("[data-workspace-view]").forEach((button) => {
      const active = button.dataset.workspaceView === state.workspaceView;
      button.classList.toggle("active", active);
      button.setAttribute("aria-selected", String(active));
    });
  }

  function applyLayout() {
    applyWorkspaceMode();
    if (state.workspaceView === "memory" && memoryModel) {
      const availableWidth = Math.max(1, tracks.clientWidth - layoutLimits.splitter);
      const workspaceWidth = clamp(
        availableWidth * state.layout.memoryRatio,
        layoutLimits.left + layoutLimits.middle,
        availableWidth - layoutLimits.code,
      );
      state.layout.memoryRatio = workspaceWidth / availableWidth;
      tracks.style.gridTemplateColumns = `${Math.round(workspaceWidth)}px ${layoutLimits.splitter}px minmax(${layoutLimits.code}px, 1fr)`;
      const rightSeparator = tracks.querySelector('[data-column-resizer="middle-code"]');
      rightSeparator?.setAttribute("aria-valuenow", String(Math.round(state.layout.memoryRatio * 100)));
      return;
    }
    const availableWidth = Math.max(1, tracks.clientWidth - layoutLimits.splitter * 2);
    let leftWidth = clamp(
      availableWidth * state.layout.leftRatio,
      layoutLimits.left,
      availableWidth - layoutLimits.middle - layoutLimits.code,
    );
    let middleWidth = clamp(
      availableWidth * state.layout.middleRatio,
      layoutLimits.middle,
      availableWidth - leftWidth - layoutLimits.code,
    );
    if (availableWidth - leftWidth - middleWidth < layoutLimits.code) {
      middleWidth = Math.max(layoutLimits.middle, availableWidth - leftWidth - layoutLimits.code);
    }
    state.layout.leftRatio = leftWidth / availableWidth;
    state.layout.middleRatio = middleWidth / availableWidth;
    tracks.style.gridTemplateColumns = `${Math.round(leftWidth)}px ${layoutLimits.splitter}px ${Math.round(middleWidth)}px ${layoutLimits.splitter}px minmax(${layoutLimits.code}px, 1fr)`;

    const availableHeight = Math.max(1, functionBody.clientHeight - layoutLimits.splitter);
    const topHeight = clamp(
      availableHeight * state.layout.functionTopRatio,
      layoutLimits.functionTop,
      Math.max(layoutLimits.functionTop, availableHeight - layoutLimits.functionBottom),
    );
    state.layout.functionTopRatio = topHeight / availableHeight;
    functionBody.style.setProperty("--function-top-height", `${Math.round(topHeight)}px`);

    const leftSeparator = tracks.querySelector('[data-column-resizer="left-middle"]');
    const rightSeparator = tracks.querySelector('[data-column-resizer="middle-code"]');
    const rowSeparator = functionBody.querySelector("[data-function-row-resizer]");
    leftSeparator?.setAttribute("aria-valuenow", String(Math.round(state.layout.leftRatio * 100)));
    rightSeparator?.setAttribute("aria-valuenow", String(Math.round((state.layout.leftRatio + state.layout.middleRatio) * 100)));
    rowSeparator?.setAttribute("aria-valuenow", String(Math.round(state.layout.functionTopRatio * 100)));
  }

  function settleLayout() {
    if (state.workspaceView === "logic") {
      renderE2E();
      centerE2EOnModule(state.moduleId, "auto");
    }
    requestAnimationFrame(() => {
      const graphScroll = functionBody.querySelector(".function-dag-scroll");
      const activeNode = graphScroll?.querySelector(".function-node.active");
      if (graphScroll && activeNode) {
        graphScroll.scrollLeft = Math.max(0, activeNode.offsetLeft - graphScroll.clientWidth / 2);
        graphScroll.scrollTop = Math.max(0, activeNode.offsetTop - graphScroll.clientHeight / 2);
      }
      const selectedStep = functionBody.querySelector(".memory-transfer-step.selected");
      selectedStep?.scrollIntoView({ block: "nearest", inline: "center", behavior: "auto" });
      restorePinnedGraphNodeInfo();
    });
  }

  function resetLayout(scope = "all") {
    if (scope === "all" || scope === "columns") {
      state.layout.leftRatio = defaultLayout.leftRatio;
      state.layout.middleRatio = defaultLayout.middleRatio;
      state.layout.memoryRatio = defaultLayout.memoryRatio;
    }
    if (scope === "all" || scope === "rows") {
      state.layout.functionTopRatio = defaultLayout.functionTopRatio;
    }
    applyLayout();
    settleLayout();
  }

  function resizeColumns(kind, delta, start) {
    if (state.workspaceView === "memory" && memoryModel) {
      const workspaceWidth = clamp(
        start.middle + delta,
        layoutLimits.left + layoutLimits.middle,
        start.available - layoutLimits.code,
      );
      state.layout.memoryRatio = workspaceWidth / start.available;
      applyLayout();
      return;
    }
    let leftWidth = start.left;
    let middleWidth = start.middle;
    if (kind === "left-middle") {
      const pairWidth = start.left + start.middle;
      leftWidth = clamp(start.left + delta, layoutLimits.left, pairWidth - layoutLimits.middle);
      middleWidth = pairWidth - leftWidth;
    } else {
      const pairWidth = start.middle + start.code;
      middleWidth = clamp(start.middle + delta, layoutLimits.middle, pairWidth - layoutLimits.code);
    }
    state.layout.leftRatio = leftWidth / start.available;
    state.layout.middleRatio = middleWidth / start.available;
    applyLayout();
  }

  function resizeFunctionRows(delta, start) {
    const topHeight = clamp(
      start.top + delta,
      layoutLimits.functionTop,
      start.available - layoutLimits.functionBottom,
    );
    state.layout.functionTopRatio = topHeight / start.available;
    applyLayout();
  }

  function activeModule() {
    return moduleMap.get(state.moduleId) || modules[0];
  }

  function activeFunction() {
    return functionMap.get(state.functionId) || null;
  }

  function activeSegment() {
    return activeFunction()?.segments.find((item) => item.id === state.segmentId) || null;
  }

  function functionHistoryFrame(returnLine = null) {
    const fn = activeFunction();
    if (!fn) return null;
    const activeLine = Number.isInteger(returnLine) ? returnLine : state.activeLine;
    const segment = fn.segments.find((item) => activeLine >= item.start && activeLine <= item.end)
      || activeSegment()
      || fn.segments[0]
      || null;
    return {
      moduleId: fn.module_id,
      functionId: fn.id,
      segmentId: segment?.id || null,
      activeLine,
    };
  }

  function inRanges(line, ranges) {
    return ranges.some(([start, end]) => line >= start && line <= end);
  }

  function functionForLine(line) {
    return functions
      .filter((item) => line >= item.start && line <= item.end)
      .sort((a, b) => (a.end - a.start) - (b.end - b.start))[0] || null;
  }

  function moduleForLine(line) {
    const fn = functionForLine(line);
    if (fn) return moduleMap.get(fn.module_id);
    return modules.find((item) => inRanges(line, item.ranges)) || modules[0];
  }

  function moduleRangeLabel(module) {
    const ranges = module.ranges || [];
    if (ranges.length === 1) return `L${ranges[0][0]}–${ranges[0][1]}`;
    const visible = ranges.slice(0, 2).map(([start, end]) => `L${start}–${end}`).join(" · ");
    return ranges.length > 2 ? `${visible} · +${ranges.length - 2} 段` : visible;
  }

  function graphEdgePath(from, to) {
    const deltaY = to.y - from.y;
    const bend = Math.max(42, Math.abs(deltaY) * .42);
    const direction = deltaY >= 0 ? 1 : -1;
    return `M ${from.x} ${from.y} C ${from.x} ${from.y + bend * direction}, ${to.x} ${to.y - bend * direction}, ${to.x} ${to.y}`;
  }

  function calculateE2ELayout() {
    const worldWidth = 780;
    const nodeHeight = 112;
    const top = 86;
    const gap = 170;
    const centerX = worldWidth / 2;
    const positions = new Map();
    const pathIndex = new Map(primaryPath.map((moduleId, index) => [moduleId, index]));
    primaryPath.forEach((moduleId, index) => positions.set(moduleId, { x: centerX, y: top + index * gap }));

    const sideModules = modules.filter((item) => !primaryPathSet.has(item.id) && !item.inactive);
    const laneYs = { left: [], right: [] };
    for (const module of sideModules) {
      const anchors = [];
      for (const edge of module.edges || []) {
        if (pathIndex.has(edge.to)) anchors.push(pathIndex.get(edge.to));
      }
      primaryPath.forEach((sourceId, index) => {
        if ((moduleMap.get(sourceId)?.edges || []).some((edge) => edge.to === module.id)) anchors.push(index);
      });
      const sourceRatio = Math.min(1, Math.max(0, ((module.ranges?.[0]?.[0] || 1) - 1) / Math.max(1, lines.length - 1)));
      const anchor = anchors.length
        ? anchors.reduce((sum, value) => sum + value, 0) / anchors.length
        : sourceRatio * Math.max(0, primaryPath.length - 1);
      const lane = Number(module.position?.x || 50) < 50 ? "left" : "right";
      let y = top + anchor * gap;
      while (laneYs[lane].some((usedY) => Math.abs(usedY - y) < nodeHeight + 24)) y += nodeHeight + 32;
      laneYs[lane].push(y);
      positions.set(module.id, { x: lane === "left" ? 132 : worldWidth - 132, y });
    }

    let currentBottom = Math.max(
      top + Math.max(0, primaryPath.length - 1) * gap,
      ...[...positions.values()].map((item) => item.y)
    );
    const inactiveModules = modules.filter((item) => item.inactive);
    inactiveModules.forEach((module, index) => {
      const row = Math.floor(index / 2);
      const isLeft = index % 2 === 0;
      positions.set(module.id, {
        x: isLeft ? 210 : worldWidth - 210,
        y: currentBottom + 155 + row * (nodeHeight + 34),
      });
    });
    if (inactiveModules.length) currentBottom += 155 + Math.ceil(inactiveModules.length / 2) * (nodeHeight + 34);
    const worldHeight = Math.max(720, currentBottom + nodeHeight / 2 + 90);
    return { worldWidth, worldHeight, positions };
  }

  function renderE2E() {
    const oldScrollTop = e2eBody.scrollTop;
    const oldScrollLeft = e2eBody.scrollLeft;
    const layout = calculateE2ELayout();
    const primaryPairs = new Set(primaryPath.slice(0, -1).map((sourceId, index) => `${sourceId}->${primaryPath[index + 1]}`));
    const edgeRecords = modules.flatMap((source) => (source.edges || []).map((edge) => ({
      source,
      target: moduleMap.get(edge.to),
      edge,
    }))).filter((item) => item.target);
    const edges = edgeRecords.map(({ source, target, edge }) => {
      const pair = `${source.id}->${target.id}`;
      const related = source.id === state.moduleId || target.id === state.moduleId;
      return `<path class="edge-path ${esc(edge.kind)} ${primaryPairs.has(pair) ? "primary" : ""} ${related ? "related" : ""}"
        d="${graphEdgePath(layout.positions.get(source.id), layout.positions.get(target.id))}"
        marker-end="url(#arrow-${esc(edge.kind)})"></path>`;
    }).join("");
    const edgeLabels = edgeRecords.map(({ source, target, edge }) => {
      if (!edge.label) return "";
      const from = layout.positions.get(source.id);
      const to = layout.positions.get(target.id);
      const pair = `${source.id}->${target.id}`;
      const related = source.id === state.moduleId || target.id === state.moduleId;
      return `<span class="edge-label ${primaryPairs.has(pair) ? "primary" : ""} ${related ? "related" : ""}"
        style="left:${(from.x + to.x) / 2}px;top:${(from.y + to.y) / 2}px" title="${esc(edge.label)}">${esc(edge.label)}</span>`;
    }).join("");
    const nodes = orderedModules.map((module) => {
      const position = layout.positions.get(module.id);
      const number = String(moduleNumberMap.get(module.id)).padStart(2, "0");
      return `
        <button type="button" class="module-node ${module.id === state.moduleId ? "active" : ""} ${module.inactive ? "inactive" : ""} ${primaryPathSet.has(module.id) ? "primary" : "side"}"
          data-module="${esc(module.id)}" data-graph-info="module" data-info-name="${esc(module.name)}"
          data-info-meta="第 ${number} 模块 · ${esc(moduleRangeLabel(module))}${module.inactive ? " · 未激活" : ""}"
          data-info-summary="${esc(module.summary)}" aria-pressed="${String(module.id === state.moduleId)}"
          aria-label="${esc(module.name)}：${esc(module.summary)}" style="left:${position.x}px;top:${position.y}px;--node-color:${esc(module.color || "#2457d6")}">
          <span class="module-meta"><b class="module-order">${number}</b><span class="module-range">${esc(moduleRangeLabel(module))}</span></span>
          ${module.inactive ? '<span class="module-badge">未激活</span>' : ""}
          <span class="module-name">${esc(module.name)}</span>
          <span class="module-summary">${esc(module.summary)}</span>
        </button>`;
    }).join("");
    const scaledWidth = Math.round(layout.worldWidth * state.e2eZoom);
    const scaledHeight = Math.round(layout.worldHeight * state.e2eZoom);
    const horizontalGutter = Math.max(96, Math.round(e2eBody.clientWidth / 2));
    const verticalGutter = Math.max(96, Math.round(e2eBody.clientHeight / 2));
    e2eBody.innerHTML = `
      <div class="e2e-toolbar" aria-label="E2E DAG 缩放工具">
        <span class="primary-path-key"><i></i>典型路径 ${primaryPath.length} 步</span>
        <button type="button" data-e2e-zoom="out" title="缩小 E2E DAG">−</button>
        <output id="e2e-zoom-level">${Math.round(state.e2eZoom * 100)}%</output>
        <button type="button" data-e2e-zoom="in" title="放大 E2E DAG">＋</button>
        <button type="button" data-e2e-zoom="fit" title="适合当前列宽">适合</button>
      </div>
      <div class="e2e-stage" style="width:${scaledWidth + horizontalGutter * 2}px;height:${scaledHeight + verticalGutter * 2}px">
        <div class="e2e-canvas" style="left:${horizontalGutter}px;top:${verticalGutter}px;width:${layout.worldWidth}px;height:${layout.worldHeight}px;transform:scale(${state.e2eZoom})">
          <svg class="edge-layer" viewBox="0 0 ${layout.worldWidth} ${layout.worldHeight}" aria-hidden="true">
            <defs>
              <marker id="arrow-control" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#aab5c5"></path></marker>
              <marker id="arrow-data" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2d7eaa"></path></marker>
              <marker id="arrow-sync" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7a4db3"></path></marker>
              <marker id="arrow-handshake" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7a4db3"></path></marker>
            </defs>
            ${edges}
          </svg>
          ${edgeLabels}
          ${nodes}
        </div>
      </div>`;
    requestAnimationFrame(() => {
      e2eBody.scrollTop = oldScrollTop;
      e2eBody.scrollLeft = oldScrollLeft;
    });
    document.getElementById("module-stat").textContent = `${modules.length} 模块 · ${edgeRecords.length} 边`;
  }

  function centerE2EOnModule(moduleId, behavior = "smooth") {
    requestAnimationFrame(() => {
      const node = e2eBody.querySelector(`[data-module="${moduleId}"]`);
      if (!node) return;
      const bodyRect = e2eBody.getBoundingClientRect();
      const nodeRect = node.getBoundingClientRect();
      const left = e2eBody.scrollLeft
        + nodeRect.left + nodeRect.width / 2
        - bodyRect.left - bodyRect.width / 2;
      const top = e2eBody.scrollTop
        + nodeRect.top + nodeRect.height / 2
        - bodyRect.top - bodyRect.height / 2;
      e2eBody.scrollTo({
        left: Math.max(0, left),
        top: Math.max(0, top),
        behavior,
      });
    });
  }

  function setE2EZoom(action) {
    const oldZoom = state.e2eZoom;
    if (action === "in") state.e2eZoom = Math.min(1.35, state.e2eZoom + .1);
    if (action === "out") state.e2eZoom = Math.max(.5, state.e2eZoom - .1);
    if (action === "fit") {
      const { worldWidth } = calculateE2ELayout();
      state.e2eZoom = Math.min(1, Math.max(.5, (e2eBody.clientWidth - 24) / worldWidth));
    }
    if (state.e2eZoom === oldZoom && action !== "fit") return;
    renderE2E();
    centerE2EOnModule(state.moduleId, "auto");
  }

  function renderIo(items, type) {
    if (!items?.length) return '<span class="io-token">—</span>';
    return items.map((item) => `<span class="io-token ${type}" title="${esc(symbolMap.get(item)?.description || item)}">${esc(item)}</span>`).join("");
  }

  function buildFunctionCallGraph(moduleFunctions) {
    const localIds = new Set(moduleFunctions.map((item) => item.id));
    const nodes = new Map(moduleFunctions.map((item) => [item.id, { fn: item, local: true }]));
    const edgeMap = new Map();
    for (const fn of moduleFunctions) {
      for (const segment of fn.segments || []) {
        for (const call of segment.calls || []) {
          if (call.type !== "internal" || !call.target || !functionMap.has(call.target)) continue;
          const target = functionMap.get(call.target);
          if (!nodes.has(target.id)) nodes.set(target.id, { fn: target, local: localIds.has(target.id) });
          const key = `${fn.id}->${target.id}`;
          if (!edgeMap.has(key)) edgeMap.set(key, { from: fn.id, to: target.id, lines: [] });
          edgeMap.get(key).lines.push(call.line);
        }
      }
    }
    const edges = [...edgeMap.values()];
    const indegree = new Map([...nodes.keys()].map((id) => [id, 0]));
    const outgoing = new Map([...nodes.keys()].map((id) => [id, []]));
    for (const edge of edges) {
      indegree.set(edge.to, (indegree.get(edge.to) || 0) + 1);
      outgoing.get(edge.from)?.push(edge.to);
    }
    const levels = new Map([...nodes.keys()].map((id) => [id, 0]));
    const queue = [...nodes.keys()]
      .filter((id) => indegree.get(id) === 0)
      .sort((a, b) => Number(nodes.get(b).local) - Number(nodes.get(a).local) || nodes.get(a).fn.start - nodes.get(b).fn.start);
    const remaining = new Map(indegree);
    while (queue.length) {
      const sourceId = queue.shift();
      for (const targetId of outgoing.get(sourceId) || []) {
        levels.set(targetId, Math.max(levels.get(targetId), levels.get(sourceId) + 1));
        remaining.set(targetId, remaining.get(targetId) - 1);
        if (remaining.get(targetId) === 0) queue.push(targetId);
      }
    }
    const groups = new Map();
    for (const [id, node] of nodes) {
      const level = levels.get(id) || 0;
      if (!groups.has(level)) groups.set(level, []);
      groups.get(level).push({ id, ...node });
    }
    for (const group of groups.values()) {
      group.sort((a, b) => Number(b.local) - Number(a.local) || a.fn.start - b.fn.start || a.fn.name.localeCompare(b.fn.name));
    }
    const maxGroupSize = Math.max(1, ...[...groups.values()].map((group) => group.length));
    const worldWidth = Math.max(560, maxGroupSize * 148 + 48);
    const maxLevel = Math.max(0, ...groups.keys());
    const worldHeight = Math.max(190, (maxLevel + 1) * 104 + 36);
    const positions = new Map();
    for (const [level, group] of groups) {
      group.forEach((node, index) => positions.set(node.id, {
        x: worldWidth * (index + 1) / (group.length + 1),
        y: 54 + level * 104,
      }));
    }
    return { nodes, edges, positions, worldWidth, worldHeight, localIds };
  }

  function renderFunctionCallGraph(moduleFunctions) {
    const graph = buildFunctionCallGraph(moduleFunctions);
    const edges = graph.edges.map((edge) => {
      const from = graph.positions.get(edge.from);
      const to = graph.positions.get(edge.to);
      return `<path class="function-edge" d="${graphEdgePath(from, to)}" marker-end="url(#function-arrow)"></path>`;
    }).join("");
    const labels = graph.edges.map((edge) => {
      const from = graph.positions.get(edge.from);
      const to = graph.positions.get(edge.to);
      const uniqueLines = [...new Set(edge.lines)].sort((a, b) => a - b);
      const label = uniqueLines.length === 1 ? `L${uniqueLines[0]}` : `${uniqueLines.length} 处调用`;
      return `<span class="function-edge-label" style="left:${(from.x + to.x) / 2}px;top:${(from.y + to.y) / 2}px">${label}</span>`;
    }).join("");
    const nodes = [...graph.nodes.entries()].map(([id, node]) => {
      const position = graph.positions.get(id);
      const owner = moduleMap.get(node.fn.module_id);
      const ownerLabel = node.local ? "本模块函数" : `跨模块 · ${owner?.name || "其他模块"}`;
      return `<button type="button" class="function-node ${id === state.functionId ? "active" : ""} ${node.local ? "local" : "cross-module"}"
        data-function="${esc(id)}" data-graph-info="function" data-info-name="${esc(node.fn.name)}"
        data-info-meta="${esc(ownerLabel)} · L${node.fn.start}–${node.fn.end}" data-info-summary="${esc(node.fn.summary)}"
        aria-pressed="${String(id === state.functionId)}" aria-label="${esc(node.fn.name)}：${esc(node.fn.summary)}"
        style="left:${position.x}px;top:${position.y}px">
        <span class="function-node-name">${esc(node.fn.name)}</span>
        <span class="function-node-meta">L${node.fn.start}–${node.fn.end}${node.local ? "" : ` · ${esc(owner?.name || "其他模块")}`}</span>
      </button>`;
    }).join("");
    return {
      html: `<div class="function-graph-canvas" style="width:${graph.worldWidth}px;height:${graph.worldHeight}px">
        <svg class="function-edge-layer" viewBox="0 0 ${graph.worldWidth} ${graph.worldHeight}" aria-hidden="true">
          <defs><marker id="function-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8d9bb0"></path></marker></defs>
          ${edges}
        </svg>
        ${labels}
        ${nodes}
      </div>`,
      edgeCount: graph.edges.length,
      crossCount: [...graph.nodes.values()].filter((node) => !node.local).length,
    };
  }

  function activeMemoryPath() {
    return memoryPathMap.get(state.memoryPathId) || memoryPaths[0] || null;
  }

  function activeMemoryTransfer() {
    return memoryTransferMap.get(state.transferId) || memoryTransfers[0] || null;
  }

  function memoryEdgePath(from, to, curve = 0) {
    const deltaX = to.x - from.x;
    const deltaY = to.y - from.y;
    if (Math.abs(deltaX) >= Math.abs(deltaY)) {
      const bendX = Math.max(55, Math.abs(deltaX) * .44);
      const direction = deltaX >= 0 ? 1 : -1;
      return `M ${from.x} ${from.y} C ${from.x + bendX * direction} ${from.y + curve}, ${to.x - bendX * direction} ${to.y + curve}, ${to.x} ${to.y}`;
    }
    const bendY = Math.max(55, Math.abs(deltaY) * .44);
    const direction = deltaY >= 0 ? 1 : -1;
    return `M ${from.x} ${from.y} C ${from.x + curve} ${from.y + bendY * direction}, ${to.x + curve} ${to.y - bendY * direction}, ${to.x} ${to.y}`;
  }

  function memoryEdgeCurve(transfer) {
    const siblings = memoryTransfers.filter((item) => item.from === transfer.from && item.to === transfer.to);
    if (siblings.length <= 1) return (transfer.curve || 0) * 1.45;
    const index = siblings.findIndex((item) => item.id === transfer.id);
    const siblingLane = (index - (siblings.length - 1) / 2) * 52;
    return siblingLane + (transfer.curve || 0) * .35;
  }
