interface:
  display_name: "全局数据包流动网图"
  short_description: "制作多屏联动数据流图，复杂三维关系用交互式3D辅助理解，保留逐块证据、时序和完成曲线"
  default_prompt: "使用 $global-packet-flow 将全卡多核日志制作成多屏联动网图。遇到三维复杂逻辑、多层依赖或用户要求三维展示时，生成可旋转、缩放、点选的交互式 3D，并保留二维时间线与逐块证据。控制页只放操作、表格和证据；允许多个动画 HTML 独立选图并共享时间和筛选，镜头保持窗口独立。始终保留 slot×block 逐位置填充，可独立放大、翻页和钻取证据。补全 512 组合以内原子包时序、完成度关键节点、包/tick 吞吐及 group/rank 组成；未知接收状态保持未知。"
