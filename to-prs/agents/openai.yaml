interface:
  display_name: "小型 PR 拆分与维护"
  short_description: "仅向目标仓库提交一个完整核心 PR，辅助 PR 放私仓，核验并解释大段增删"
  default_prompt: "使用 $to-prs 拆分或维护 PR：仅将唯一且功能完整的核心 PR 提交到目标仓库的目标分支，测试、调试脚本、文档等辅助 PR 的源分支与目标分支都放在自己的私有 fork 或私有镜像仓库；每个最多 150 行，核心超限时申请例外。逐块校验大段删除与新增的必要性、原职责去向和验证依据，并在对应代码注释或 PR 逐行评论中解释理由，不能只在 PR 描述中概括。核实私仓可见性和每个 PR 的实际去向，公开 fork 无法设为私有时使用独立私有镜像。按任务处理冲突、审查与真实验证，用简短易懂的描述讲清问题、思路和实验结论，不写个人调试日志与机器目录。仅改描述时只核对并改写说明。"
